name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./scripts/build.sh
      - name: Run non-intercepting tests
        run: ./scripts/test.sh
      - name: Package development artifacts
        run: ./scripts/package.sh --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: MacInputGuard-development
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
